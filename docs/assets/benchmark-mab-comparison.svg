<svg width="760" height="573" viewBox="0 0 760 573" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="MemoryAgentBench FactConsolidation single-hop at 262K context, substring exact match, gpt-4o-mini reader. Knowl 90. agentmemory 79. GPT-4o long context 60. HippoRAG-v2 54. BM25 48. GPT-4o-mini long context 45. Qwen3-Embedding-4B 29. Cognee 28. MemGPT 28. Mem0 18. MIRIX 14. Zep 7. Knowl and agentmemory measured here; all other figures from the MemoryAgentBench paper, arXiv 2507.05257v4, Table 3.">
