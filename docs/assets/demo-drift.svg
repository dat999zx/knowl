<svg width="1000" height="340" viewBox="0 0 1000 340" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Two stores over the same six months. In an append-only store every note stays true forever and a query today matches four contradicting answers. In a governed store each superseded fact ends where it stopped being true, so the same query matches one.">
  <rect x="1" y="1" width="998" height="338" rx="16" fill="#161b22" stroke="#2c313a" stroke-width="1.5"/>

  <text x="36" y="38" font-size="15" font-weight="700" fill="#ffffff">The same six months, two stores</text>

  <!-- append-only -->
  <text x="36" y="76" font-size="12" font-weight="700" fill="#6e7681" letter-spacing="1.4">APPEND-ONLY</text>
  <g font-size="11.5" fill="#6e7681">
    <text x="176" y="76">Jan</text><text x="356" y="76">Mar</text><text x="536" y="76">Jun</text><text x="716" y="76">Sep</text>
  </g>

  <g>
    <rect x="176" y="88" width="700" height="12" rx="6" fill="#3987e5" opacity="0.85"/>
    <text x="182" y="82" font-size="10.5" fill="#6e7681">JWTs</text>
    <rect x="356" y="108" width="520" height="12" rx="6" fill="#3987e5" opacity="0.85"/>
    <text x="362" y="102" font-size="10.5" fill="#6e7681">session cookies</text>
    <rect x="536" y="128" width="340" height="12" rx="6" fill="#3987e5" opacity="0.85"/>
    <text x="542" y="122" font-size="10.5" fill="#6e7681">short-lived JWTs again</text>
    <rect x="716" y="148" width="160" height="12" rx="6" fill="#3987e5" opacity="0.85"/>
    <text x="722" y="142" font-size="10.5" fill="#6e7681">session cookies, revocable</text>
  </g>

  <!-- governed -->
  <text x="36" y="212" font-size="12" font-weight="700" fill="#6e7681" letter-spacing="1.4">GOVERNED</text>
  <g>
    <rect x="176" y="224" width="176" height="12" rx="6" fill="#484f58"/>
    <rect x="356" y="244" width="176" height="12" rx="6" fill="#484f58"/>
    <rect x="536" y="264" width="176" height="12" rx="6" fill="#484f58"/>
    <rect x="716" y="284" width="160" height="12" rx="6" fill="#199e70"/>
    <text x="722" y="278" font-size="10.5" fill="#3fb950">still true today</text>
  </g>

  <!-- today, sweeping -->
  <g>
    <line x1="176" y1="84" x2="176" y2="308" stroke="#eda100" stroke-width="1.5" stroke-dasharray="4 4">
      <animate attributeName="x1" values="176;876;876" keyTimes="0;0.62;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="176;876;876" keyTimes="0;0.62;1" dur="9s" repeatCount="indefinite"/>
    </line>
    <text x="176" y="324" font-size="11" font-weight="700" fill="#eda100" text-anchor="middle">today
      <animate attributeName="x" values="176;876;876" keyTimes="0;0.62;1" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- what a query finds at the end of the sweep -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.640;0.690;0.940;1" dur="9s" repeatCount="indefinite"/>
    <rect x="892" y="84" width="76" height="80" rx="8" fill="#2a1f18" stroke="#7a4b1f"/>
    <text x="930" y="118" font-size="22" font-weight="700" fill="#eda100" text-anchor="middle">4</text>
    <text x="930" y="138" font-size="10.5" fill="#a0783c" text-anchor="middle">answers,</text>
    <text x="930" y="152" font-size="10.5" fill="#a0783c" text-anchor="middle">3 retired</text>

    <rect x="892" y="240" width="76" height="66" rx="8" fill="#0f2e1f" stroke="#1c5c3c"/>
    <text x="930" y="274" font-size="22" font-weight="700" fill="#3fb950" text-anchor="middle">1</text>
    <text x="930" y="294" font-size="10.5" fill="#5fa77c" text-anchor="middle">answer</text>
  </g>
</svg>
