<svg width="900" height="356" viewBox="0 0 900 356" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Anatomy of one decision atom: a category and status pill, title and content, then freshness, confidence, tags, source commit, affected paths, and evidence — with one symbol locator shown gone stale because the code moved">
  <rect x="1" y="1" width="898" height="354" rx="16" fill="#161b22" stroke="#2c313a" stroke-width="1.5"/>

  <text x="28" y="40" font-size="21" font-weight="700" fill="#ffffff">Anatomy of one atom</text>
  <text x="28" y="63" font-size="13.5" fill="#898781">What &#8220;typed, not free text&#8221; actually buys you</text>

  <!-- the atom card -->
  <rect x="28" y="82" width="420" height="234" rx="12" fill="#0d1117" stroke="#30363d"/>

  <rect x="48" y="100" width="66" height="20" rx="10" fill="#132b47" stroke="#1f4b7a"/>
  <text x="81" y="114" font-size="11" font-weight="600" fill="#58a6ff" text-anchor="middle">decision</text>
  <rect x="122" y="100" width="52" height="20" rx="10" fill="#0f2e1f" stroke="#1c5c3c"/>
  <text x="148" y="114" font-size="11" font-weight="600" fill="#3fb950" text-anchor="middle">active</text>

  <text x="48" y="146" font-size="15" font-weight="700" fill="#ffffff">Use SQLite</text>
  <text x="48" y="167" font-size="11.5" fill="#898781">Lives beside the code. No server to run.</text>

  <line x1="48" y1="182" x2="428" y2="182" stroke="#30363d"/>

  <text x="48" y="203" font-size="11.5" fill="#6e7681">freshness</text>
  <text x="166" y="203" font-size="11.5" fill="#c9d1d9">fresh</text>

  <text x="48" y="225" font-size="11.5" fill="#6e7681">confidence</text>
  <text x="166" y="225" font-size="11.5" fill="#c9d1d9">0.95</text>

  <text x="48" y="247" font-size="11.5" fill="#6e7681">tags</text>
  <text x="166" y="247" font-size="11.5" fill="#c9d1d9">database · local-first</text>

  <text x="48" y="269" font-size="11.5" fill="#6e7681">source commit</text>
  <text x="166" y="269" font-size="11.5" fill="#c9d1d9">7b2e04c</text>

  <text x="48" y="291" font-size="11.5" fill="#6e7681">affected paths</text>
  <text x="166" y="291" font-size="11.5" fill="#c9d1d9">src/store/database.ts</text>

  <circle cx="52" cy="308" r="3.5" fill="#eda100"/>
  <text x="66" y="312" font-size="11.5" fill="#6e7681">evidence</text>
  <text x="166" y="312" font-size="11.5" fill="#eda100">symbol://openDatabase</text>

  <!-- connectors -->
  <path d="M448 110 H482" stroke="#3987e5" stroke-width="1.2"/>
  <path d="M448 225 H482" stroke="#3987e5" stroke-width="1.2"/>
  <path d="M448 280 H482" stroke="#3987e5" stroke-width="1.2"/>
  <path d="M448 312 H482" stroke="#eda100" stroke-width="1.2"/>

  <!-- callouts -->
  <text x="492" y="106" font-size="12.5" font-weight="700" fill="#3987e5">status</text>
  <text x="492" y="125" font-size="12" fill="#898781">Retired the moment it stops being true —</text>
  <text x="492" y="142" font-size="12" fill="#898781">not left beside its replacement.</text>

  <text x="492" y="204" font-size="12.5" font-weight="700" fill="#3987e5">freshness · confidence · tags</text>
  <text x="492" y="223" font-size="12" fill="#898781">Retrieval ranks on these, and freshness ages</text>
  <text x="492" y="240" font-size="12" fill="#898781">on its own. You cannot rank a paragraph.</text>

  <text x="492" y="277" font-size="12.5" font-weight="700" fill="#3987e5">source commit · affected paths</text>
  <text x="492" y="296" font-size="12" fill="#898781">Which version of the code this was true about.</text>

  <text x="492" y="316" font-size="12.5" font-weight="700" fill="#eda100">evidence</text>
  <text x="492" y="333" font-size="12" fill="#898781">Went stale by itself when the symbol moved.</text>
</svg>
