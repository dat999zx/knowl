<svg width="1000" height="400" viewBox="0 0 1000 400" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="An agent is asked which database the project uses. It calls knowl_query, which returns the active decision and skips its superseded predecessor. The agent answers SQLite and knows that PostgreSQL was considered and rejected, without opening a single file.">
  <defs>
    <radialGradient id="agentPulse" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#199e70" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#199e70" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="998" height="398" rx="16" fill="#161b22" stroke="#2c313a" stroke-width="1.5"/>

  <text x="36" y="40" font-size="12" font-weight="700" fill="#6e7681" letter-spacing="1.6">CODING AGENT</text>
  <text x="536" y="40" font-size="12" font-weight="700" fill="#6e7681" letter-spacing="1.6">PROJECT MEMORY</text>
  <line x1="500" y1="24" x2="500" y2="376" stroke="#2c313a" stroke-dasharray="3 5"/>

  <!-- the question -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.050;0.075;0.875;0.950;1" dur="8s" repeatCount="indefinite"/>
    <rect x="36" y="62" width="418" height="52" rx="10" fill="#1c2333" stroke="#2f3b52"/>
    <text x="56" y="93" font-size="15" fill="#c9d1d9">which database does this project use?</text>
  </g>

  <!-- the query, and the beam that carries it -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.150;0.175;0.875;0.950;1" dur="8s" repeatCount="indefinite"/>
    <text x="56" y="150" font-size="13.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#58a6ff">knowl_query "database"</text>
    <path d="M300 168 H494" stroke="#1f4b7a" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="300" cy="168" r="4.5" fill="#58a6ff">
      <animate attributeName="cx" values="300;300;494;494" keyTimes="0;0.175;0.275;1" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- the atom that is current -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.270;0.300;0.875;0.950;1" dur="8s" repeatCount="indefinite"/>
    <ellipse cx="740" cy="98" rx="230" ry="58" fill="url(#agentPulse)">
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.06;0.30;1" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <rect x="536" y="62" width="428" height="76" rx="10" fill="#0d1117" stroke="#199e70" stroke-width="1.5"/>
    <circle cx="558" cy="86" r="4" fill="#3fb950"/>
    <text x="572" y="90" font-size="11.5" fill="#3fb950">decision · active · fresh</text>
    <text x="558" y="112" font-size="14.5" font-weight="700" fill="#ffffff">Database choice</text>
    <text x="558" y="130" font-size="12" fill="#898781">SQLite. Lives beside the code, no server.</text>
  </g>

  <!-- the atom it replaced, skipped -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0.5;0.5;0;0" keyTimes="0;0.300;0.330;0.875;0.950;1" dur="8s" repeatCount="indefinite"/>
    <rect x="536" y="152" width="428" height="60" rx="10" fill="#0d1117" stroke="#30363d" stroke-dasharray="5 4"/>
    <circle cx="558" cy="176" r="4" fill="#6e7681"/>
    <text x="572" y="180" font-size="11.5" fill="#eda100">decision · superseded</text>
    <text x="558" y="200" font-size="13" fill="#6e7681">Database choice — PostgreSQL</text>
    <line x1="558" y1="196" x2="792" y2="196" stroke="#6e7681" stroke-width="1"/>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.330;0.360;0.875;0.950;1" dur="8s" repeatCount="indefinite"/>
    <text x="536" y="238" font-size="12" fill="#6e7681">retrieval skips it — it stopped being true, and the store knows</text>
  </g>

  <!-- the answer travelling back -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.430;0.455;0.875;0.950;1" dur="8s" repeatCount="indefinite"/>
    <path d="M494 276 H300" stroke="#1e5c38" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="494" cy="276" r="4.5" fill="#3fb950">
      <animate attributeName="cx" values="494;494;300;300" keyTimes="0;0.455;0.545;1" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.550;0.580;0.875;0.950;1" dur="8s" repeatCount="indefinite"/>
    <rect x="36" y="252" width="440" height="96" rx="10" fill="#12251a" stroke="#1e5c38"/>
    <text x="56" y="282" font-size="14" fill="#c9d1d9">SQLite — it sits beside the code.</text>
    <text x="56" y="304" font-size="14" fill="#c9d1d9">Postgres was considered and dropped:</text>
    <text x="56" y="326" font-size="14" fill="#c9d1d9">it needs a server, this has to work offline.</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.600;0.630;0.875;0.950;1" dur="8s" repeatCount="indefinite"/>
    <text x="36" y="374" font-size="12" fill="#6e7681">no files opened · new session · nothing pasted in</text>
  </g>
</svg>
