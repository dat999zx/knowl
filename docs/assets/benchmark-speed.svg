<svg width="760" height="212" viewBox="0 0 760 212" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Retrieval speed and footprint: p50 latency 5 milliseconds, p95 latency 25 milliseconds, average context 1.3 kilobytes per query">
  <rect x="1" y="1" width="758" height="210" rx="16" fill="#161b22" stroke="#2c313a" stroke-width="1.5"/>

  <text x="28" y="42" font-size="21" font-weight="700" fill="#ffffff">Speed &amp; footprint</text>
  <text x="28" y="66" font-size="14" fill="#898781">in-process retrieval over the 500-case suite — query path, no network</text>

  <!-- three stat tiles -->
  <g>
    <rect x="28" y="88" width="221" height="96" rx="12" fill="#0f141c" stroke="#242b36"/>
    <rect x="269.5" y="88" width="221" height="96" rx="12" fill="#0f141c" stroke="#242b36"/>
    <rect x="511" y="88" width="221" height="96" rx="12" fill="#0f141c" stroke="#242b36"/>
  </g>

  <g text-anchor="middle">
    <!-- tile 1 -->
    <text x="138" y="140" font-size="40" font-weight="800" fill="#3987e5">~30<tspan font-size="20" font-weight="700" fill="#7cb0f5"> ms</tspan></text>
    <text x="138" y="166" font-size="13" font-weight="600" fill="#c3c2b7">p50 query latency</text>
    <!-- tile 2 -->
    <text x="380" y="140" font-size="40" font-weight="800" fill="#3987e5">~45<tspan font-size="20" font-weight="700" fill="#7cb0f5"> ms</tspan></text>
    <text x="380" y="166" font-size="13" font-weight="600" fill="#c3c2b7">p95 query latency</text>
    <!-- tile 3 -->
    <text x="621.5" y="140" font-size="40" font-weight="800" fill="#199e70">~5.8<tspan font-size="20" font-weight="700" fill="#5fcf9f"> KB</tspan></text>
    <text x="621.5" y="166" font-size="13" font-weight="600" fill="#c3c2b7">avg context / query</text>
  </g>
</svg>
