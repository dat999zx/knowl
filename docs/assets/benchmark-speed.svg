<svg width="760" height="212" viewBox="0 0 760 212" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Speed and footprint: vector fusion p50 about 300 milliseconds embedding-bound, BM25-only fallback about 30 milliseconds, average context about 6 kilobytes per query">
  <rect x="1" y="1" width="758" height="210" rx="16" fill="#161b22" stroke="#2c313a" stroke-width="1.5"/>

  <text x="28" y="42" font-size="21" font-weight="700" fill="#ffffff">Speed &amp; footprint</text>
  <text x="28" y="66" font-size="14" fill="#898781">in-process over the 500-case suite — no network; pick semantics or raw speed</text>

  <g>
    <rect x="28" y="88" width="221" height="96" rx="12" fill="#0f141c" stroke="#242b36"/>
    <rect x="269.5" y="88" width="221" height="96" rx="12" fill="#0f141c" stroke="#242b36"/>
    <rect x="511" y="88" width="221" height="96" rx="12" fill="#0f141c" stroke="#242b36"/>
  </g>

  <g text-anchor="middle">
    <text x="138" y="140" font-size="38" font-weight="800" fill="#3987e5">~0.3<tspan font-size="20" font-weight="700" fill="#7cb0f5"> s</tspan></text>
    <text x="138" y="166" font-size="13" font-weight="600" fill="#c3c2b7">p50 with local vector</text>

    <text x="380" y="140" font-size="38" font-weight="800" fill="#199e70">~30<tspan font-size="20" font-weight="700" fill="#5fcf9f"> ms</tspan></text>
    <text x="380" y="166" font-size="13" font-weight="600" fill="#c3c2b7">p50 BM25-only fallback</text>

    <text x="621.5" y="140" font-size="38" font-weight="800" fill="#199e70">~6<tspan font-size="20" font-weight="700" fill="#5fcf9f"> KB</tspan></text>
    <text x="621.5" y="166" font-size="13" font-weight="600" fill="#c3c2b7">avg context / query</text>
  </g>
</svg>
