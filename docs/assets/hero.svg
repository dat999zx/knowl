<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Knowl - governed project memory for AI coding agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#111722"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#39d3e5" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#39d3e5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="338" rx="20" fill="url(#bg)" stroke="#2c313a" stroke-width="1.5"/>
  <rect x="1" y="1" width="1198" height="338" rx="20" fill="url(#glow)"/>

  <!-- The Knowl logo: docs/assets/logo.png, cut out of its tile so the banner
       gradient shows through, and embedded so this file stays self-contained. -->
  <image x="92" y="95" width="110" height="150"
         href="data:image/png;base64,"/>

  <g transform="translate(265,0)">
    <text x="0" y="158" font-size="25" font-weight="500" fill="#e6edf3">Governed project memory for AI coding agents</text>

    <g transform="translate(0,186)" font-size="13" font-weight="600">
      <g transform="translate(0,0)">
        <rect x="0" y="0" width="120" height="28" rx="14" fill="#1b2330" stroke="#2c313a"/>
        <circle cx="17" cy="14" r="4" fill="#319e19"/>
        <text x="28" y="19" fill="#e6edf3">Local-first</text>
      </g>
      <g transform="translate(132,0)">
        <rect x="0" y="0" width="148" height="28" rx="14" fill="#1b2330" stroke="#2c313a"/>
        <circle cx="17" cy="14" r="4" fill="#39d3e5"/>
        <text x="28" y="19" fill="#e6edf3">Governed memory</text>
      </g>
      <g transform="translate(292,0)">
        <rect x="0" y="0" width="113" height="28" rx="14" fill="#1b2330" stroke="#2c313a"/>
        <circle cx="17" cy="14" r="4" fill="#319e19"/>
        <text x="28" y="19" fill="#e6edf3">Workspaces</text>
      </g>
      <g transform="translate(417,0)">
        <rect x="0" y="0" width="113" height="28" rx="14" fill="#1b2330" stroke="#2c313a"/>
        <circle cx="17" cy="14" r="4" fill="#edbd00"/>
        <text x="28" y="19" fill="#e6edf3">MCP-native</text>
      </g>
    </g>
  </g>

  <!-- Typed atoms around the store: the seven categories, not decoration. -->
  <g transform="translate(840,45)" opacity="0.96">
    <g stroke="#39d3e5" stroke-width="1.6" opacity="0.5">
      <line x1="150" y1="110" x2="60" y2="40"/>
      <line x1="150" y1="110" x2="250" y2="46"/>
      <line x1="150" y1="110" x2="40" y2="170"/>
      <line x1="150" y1="110" x2="255" y2="168"/>
      <line x1="150" y1="110" x2="150" y2="210"/>
      <line x1="60" y1="40" x2="250" y2="46"/>
      <line x1="40" y1="170" x2="150" y2="210"/>
      <line x1="255" y1="168" x2="150" y2="210"/>
    </g>
    <circle cx="150" cy="110" r="26" fill="#12393d" stroke="#4fd8e8" stroke-width="2"/>
    <text x="150" y="116" font-size="16" font-weight="700" fill="#7ce8f5" text-anchor="middle">knowl</text>
    <g font-size="13" font-weight="700" text-anchor="middle">
      <g><circle cx="60" cy="40" r="18" fill="#161f2e" stroke="#cab049" stroke-width="2"/><text x="60" y="45" fill="#73cf5f">dec</text></g>
      <g><circle cx="250" cy="46" r="18" fill="#161f2e" stroke="#b7a0f8" stroke-width="2"/><text x="250" y="51" fill="#f0d25a">arch</text></g>
      <g><circle cx="40" cy="170" r="18" fill="#161f2e" stroke="#21c9ca" stroke-width="2"/><text x="40" y="175" fill="#7ce8f5">fact</text></g>
      <g><circle cx="255" cy="168" r="18" fill="#161f2e" stroke="#85c577" stroke-width="2"/><text x="255" y="173" fill="#e58bab">goal</text></g>
      <g><circle cx="150" cy="210" r="18" fill="#161f2e" stroke="#e691ca" stroke-width="2"/><text x="150" y="215" fill="#b3abf1">skill</text></g>
    </g>
  </g>
</svg>
