<svg width="900" height="360" viewBox="0 0 900 360" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" role="img" aria-label="Terminal demo: recording a decision, then recording a replacement under the same subject, which supersedes the first at write time. A later knowl state lists only the current decision.">
  <rect x="1" y="1" width="898" height="358" rx="16" fill="#161b22" stroke="#2c313a" stroke-width="1.5"/>

  <circle cx="30" cy="28" r="5.5" fill="#e06c62"/>
  <circle cx="50" cy="28" r="5.5" fill="#d9a441"/>
  <circle cx="70" cy="28" r="5.5" fill="#4ea75b"/>
  <text x="94" y="33" font-size="12.5" fill="#6e7681">knowl — project memory</text>
  <line x1="1" y1="50" x2="899" y2="50" stroke="#2c313a"/>

  <!-- 1: record a decision -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.043;0.054;0.893;0.964;1" dur="14s" repeatCount="indefinite"/>
    <text x="32" y="88"><tspan fill="#6e7681">$</tspan><tspan fill="#c9d1d9" dx="10">knowl decide </tspan><tspan fill="#a5d6ff">"Auth approach" "Stateless auth via JWT."</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.121;0.132;0.893;0.964;1" dur="14s" repeatCount="indefinite"/>
    <text x="52" y="116"><tspan fill="#3fb950">✓</tspan><tspan fill="#898781" dx="10">Recorded decision successfully!  ID: </tspan><tspan fill="#58a6ff">9ee1bf39</tspan></text>
  </g>

  <!-- 2: record its replacement, same subject -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.214;0.225;0.893;0.964;1" dur="14s" repeatCount="indefinite"/>
    <text x="32" y="156"><tspan fill="#6e7681">$</tspan><tspan fill="#c9d1d9" dx="10">knowl decide </tspan><tspan fill="#a5d6ff">"Auth approach" "Server-side session cookies."</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.300;0.311;0.893;0.964;1" dur="14s" repeatCount="indefinite"/>
    <text x="52" y="184"><tspan fill="#3fb950">✓</tspan><tspan fill="#898781" dx="10">Recorded decision successfully!  ID: </tspan><tspan fill="#58a6ff">a95f274e</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.350;0.361;0.893;0.964;1" dur="14s" repeatCount="indefinite"/>
    <text x="52" y="212"><tspan fill="#eda100">↻ Superseded older decision: </tspan><tspan fill="#eda100">9ee1bf39</tspan><tspan fill="#6e7681">   — at write time, unasked</tspan></text>
  </g>

  <!-- 3: the active memory holds only what is current -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.443;0.454;0.893;0.964;1" dur="14s" repeatCount="indefinite"/>
    <text x="32" y="252"><tspan fill="#6e7681">$</tspan><tspan fill="#c9d1d9" dx="10">knowl state</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.529;0.539;0.893;0.964;1" dur="14s" repeatCount="indefinite"/>
    <text x="52" y="280" font-size="13"><tspan fill="#6e7681">## DECISIONS</tspan></text>
    <text x="52" y="302"><tspan fill="#c9d1d9">### Auth approach </tspan><tspan fill="#58a6ff">(ID: a95f274e)</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.571;0.582;0.893;0.964;1" dur="14s" repeatCount="indefinite"/>
    <text x="52" y="324" font-size="13"><tspan fill="#898781">Server-side session cookies.</tspan><tspan fill="#6e7681" dx="24">the JWT decision is gone from active memory</tspan></text>
  </g>

  <!-- cursor -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.582;0.593;0.893;0.964;1" dur="14s" repeatCount="indefinite"/>
    <rect x="32" y="340" width="9" height="15" fill="#58a6ff">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
