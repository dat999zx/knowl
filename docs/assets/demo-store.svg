<svg width="1000" height="360" viewBox="0 0 1000 360" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="A write arrives naming a subject the store already holds. The replacement takes the active lane and its predecessor is stamped superseded and moved into history, so a later query sweep matches only the current decision.">
  <rect x="1" y="1" width="998" height="358" rx="16" fill="#161b22" stroke="#2c313a" stroke-width="1.5"/>

  <text x="36" y="40" font-size="12" font-weight="700" fill="#6e7681" letter-spacing="1.6">ACTIVE</text>
  <text x="700" y="40" font-size="12" font-weight="700" fill="#6e7681" letter-spacing="1.6">HISTORY</text>
  <line x1="664" y1="24" x2="664" y2="336" stroke="#2c313a" stroke-dasharray="3 5"/>

  <!-- the atom already held -->
  <g>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.330;0.360;0.940;1" dur="9s" repeatCount="indefinite"/>
    <rect x="36" y="62" width="580" height="72" rx="10" fill="#0d1117" stroke="#199e70" stroke-width="1.5"/>
    <circle cx="58" cy="86" r="4" fill="#3fb950"/>
    <text x="72" y="90" font-size="11.5" fill="#3fb950">decision · active</text>
    <text x="58" y="114" font-size="14.5" font-weight="700" fill="#ffffff">Database choice</text>
    <text x="212" y="114" font-size="13" fill="#898781">PostgreSQL</text>
  </g>

  <!-- the write arriving -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.100;0.130;0.940;0.975;1" dur="9s" repeatCount="indefinite"/>
    <text x="36" y="176" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#58a6ff">write · same subject</text>
    <path d="M180 170 H320" stroke="#1f4b7a" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="180" cy="170" r="4.5" fill="#58a6ff">
      <animate attributeName="cx" values="180;180;320;320" keyTimes="0;0.130;0.230;1" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- the predecessor, stamped and leaving -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;0.45;0.45;0;0" keyTimes="0;0.330;0.360;0.460;0.940;0.975;1" dur="9s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 0;664 92;664 92;664 92" keyTimes="0;0.330;0.380;0.470;0.940;1" dur="9s" repeatCount="indefinite"/>
    <rect x="36" y="62" width="580" height="72" rx="10" fill="#0d1117" stroke="#30363d" stroke-dasharray="5 4"/>
    <circle cx="58" cy="86" r="4" fill="#6e7681"/>
    <text x="72" y="90" font-size="11.5" fill="#eda100">decision · superseded</text>
    <text x="58" y="114" font-size="14.5" font-weight="700" fill="#6e7681">Database choice</text>
    <text x="212" y="114" font-size="13" fill="#6e7681">PostgreSQL</text>
    <line x1="58" y1="109" x2="310" y2="109" stroke="#6e7681"/>
  </g>

  <!-- the replacement taking the active lane -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.380;0.430;0.940;0.975;1" dur="9s" repeatCount="indefinite"/>
    <rect x="36" y="62" width="580" height="72" rx="10" fill="#0d1117" stroke="#199e70" stroke-width="1.5"/>
    <circle cx="58" cy="86" r="4" fill="#3fb950"/>
    <text x="72" y="90" font-size="11.5" fill="#3fb950">decision · active · fresh</text>
    <text x="58" y="114" font-size="14.5" font-weight="700" fill="#ffffff">Database choice</text>
    <text x="212" y="114" font-size="13" fill="#898781">SQLite, beside the code</text>
  </g>

  <!-- the query sweep, matching only what is live -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.600;0.630;0.940;0.975;1" dur="9s" repeatCount="indefinite"/>
    <text x="36" y="250" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#58a6ff">query "database"</text>
    <rect x="30" y="56" width="10" height="84" rx="4" fill="#58a6ff" opacity="0.5">
      <animate attributeName="x" values="30;30;610;610" keyTimes="0;0.630;0.760;1" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.780;0.810;0.940;0.975;1" dur="9s" repeatCount="indefinite"/>
    <circle cx="42" cy="288" r="4" fill="#3fb950"/>
    <text x="58" y="292" font-size="13.5" fill="#c9d1d9">1 result — the current one. The old answer is still there,</text>
    <text x="58" y="314" font-size="13.5" fill="#6e7681">queryable through its timeline, and never returned by default.</text>
  </g>
</svg>
