version: 2

# Version updates cover GitHub Actions and nothing else.
#
# npm is deliberately absent. Dependabot's first run over this dependency tree opened five PRs
# and four of them could not be merged by anyone: tree-sitter cannot leave 0.21 while
# tree-sitter-typescript's latest release still pins it there, typescript-eslint caps TypeScript
# below 6.1, and the vitest 4 lockfile arrived out of sync with its own package.json. A stream of
# unmergeable PRs is not a safety mechanism, it is a thing to be ignored, and an update mechanism
# that gets ignored is the same as not having one. Runtime upgrades here are worth making
# deliberately, one at a time, with the suite watched.
#
# What npm genuinely needs is the security channel, and that lives in repository settings rather
# than in this file: Dependabot alerts plus Dependabot security updates, which fire on a published
# advisory instead of on a version number moving. The `dependency audit` job in ci.yml is the
# second half of that -- it blocks at critical on every push, but it cannot see an advisory
# published against code that has not changed.
#
# NOTE, learned the expensive way: an invalid key anywhere in this file makes Dependabot reject
# the WHOLE file and silently keep running the last version that parsed. From 2026-08-06 to
# 2026-09-15 this file carried `semver-major-days` under github-actions, which that ecosystem
# does not support, so every run used the config from BEFORE npm was dropped -- npm PRs kept
# arriving from an entry that is not in this file, and no cooldown was ever applied. There is no
# warning on the PRs and none in Actions; the only place it is visible is
# https://github.com/dat999zx/knowl/network/updates. Check that page after editing this file.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Every `uses:` in this repository is pinned to a commit SHA, so Dependabot is the only thing
    # that moves an action forward. That makes it the single point where a compromised action
    # would enter, and a compromised release is normally yanked within hours of publication -- so
    # the cheapest defence is declining to be first to adopt it. GitHub applies a 3-day default
    # since 2026-07-14; this waits a week.
    #
    # Flat, not per-semver-bump: github-actions does not support the `semver-*-days` keys, and
    # asking for them is what invalidated this file for a month. A major action rewrite would be
    # worth a longer wait, but that has to be judged in review, not configured here.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
