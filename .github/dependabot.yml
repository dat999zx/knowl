version: 2

# Weekly rather than daily, and grouped rather than one PR per package. This repository has a
# single maintainer and a suite that takes minutes; a stream of individual bumps gets ignored,
# and an ignored update mechanism is the same as not having one.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # A compromised release is normally yanked within hours of publication, so the cheapest
    # defence against a poisoned upstream is declining to be first to adopt it. The August 2026
    # keyv/cacheable worm published its payload as major bumps -- keyv 6.0.0, flat-cache 6.1.24,
    # file-entry-cache 11.1.6 -- and majors are exactly what a single maintainer reviews last,
    # so those wait a month. GitHub applies a 3-day default since 2026-07-14; this is that idea
    # taken seriously and weighted by how much a bump is able to change.
    #
    # Cooldown governs version updates only. A real security advisory still arrives immediately,
    # which is the behaviour worth having: slow to take new code, fast to take a fix.
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      # Dev tooling moves fastest and carries the least risk -- it never reaches a user's
      # install. One PR a week for all of it.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      # Runtime patches are safe enough to batch. A runtime MAJOR stays on its own PR, because
      # @libsql/client or the MCP SDK changing shape deserves its own review and its own
      # verification run.
      production-patches:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Every `uses:` in this repository is pinned to a commit SHA, so Dependabot is the only
    # thing that moves an action forward. That makes it the single point where a compromised
    # action would enter, and the same waiting period applies for the same reason.
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      actions:
        patterns: ['*']
