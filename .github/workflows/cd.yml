name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  # `contents: write` is needed only to create the GitHub release at the end of a
  # successful publish; the OIDC exchange itself needs only id-token.
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit SHA, not by tag, and this job is the reason the whole repository does
      # it. Trusted publishing removed the stored NPM_TOKEN a thief could take, but it did not
      # remove the trust -- it moved it onto everything that runs in this job, because any step
      # here can ask for an OIDC token and publish with it. A tag is mutable, so `@v4` is a
      # standing invitation for someone else to choose what runs next to that credential.
      # Dependabot updates these and keeps the version comment current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Resolve version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Package version: $version"

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "${{ steps.version.outputs.version }}" ]; then
            echo "Tag v$tag does not match package.json version ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi

      - name: Fail if version is already on npm
        run: |
          name="$(node -p "require('./package.json').name")"
          if npm view "$name@${{ steps.version.outputs.version }}" version > /dev/null 2>&1; then
            echo "$name@${{ steps.version.outputs.version }} is already published. Bump the version first." >&2
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish to npm
        run: npm publish --access public

      # Runs only after a successful publish, so a release never advertises a version
      # that is not on npm.
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="## $VERSION" '$0 ~ "^" v {flag=1; next} flag && /^## / {exit} flag' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG section for $VERSION; falling back to generated notes."
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --latest
            exit 0
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md --latest
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --latest
          fi

  # Separate job on purpose: the registry login mints its own OIDC token, and nothing here
  # should run beside the npm one. Runs only after npm has the tarball, because the registry
  # verifies package ownership by reading `mcpName` out of the published package.
  mcp-registry:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned by version AND digest, for the same reason every action above is pinned by SHA:
      # a `latest` download is a standing invitation to run whatever is uploaded next.
      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -sSL -o mcp-publisher.tgz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tgz' | sha256sum -c -
          tar xzf mcp-publisher.tgz mcp-publisher

      - name: Publish to the MCP registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
