name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary development host and was never covered; macOS catches the
        # POSIX-but-not-Linux differences in path, permission and shell handling. Both have
        # already caught real defects here -- a snapshot regex that matched only a drive
        # letter, and mode assertions that are no-ops off POSIX.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Three suites load a real embedding model, so without this every run re-downloads it
      # from huggingface.co and a rate limit there fails the build for reasons unrelated to the
      # change under test. Observed 2026-08-05: `Error (429) ... Xenova/all-MiniLM-L6-v2/
      # config.json` took down `workspace-query`, `cross-repo-semantic` and `cross-repo-eval`
      # on a PR that touched none of them.
      #
      # `.knowl/models` and not `~/.knowl/models`: `resolveModelCache` does default to
      # `knowlHome()/models`, but no test ever sees the real home. vitest.config.ts pins
      # KNOWL_HOME to `./.knowl-test-home` suite-wide and those three override it again to
      # their own fixture, all of which are deleted before the job ends. The repo's own
      # `.knowl/models` is the one path a model-loading suite both writes and outlives -- it
      # is what `workspace-query.test.ts` and `write-embedding.test.ts` already point at, and
      # the two cross-repo suites now do too.
      #
      # Keyed on the files that name the models, so adding or switching one fetches once and
      # then caches. `restore-keys` matters more than the exact key here: on a miss it still
      # restores the newest previous cache, so a profile change re-downloads only what
      # actually changed instead of everything.
      #
      # Split into restore and save rather than one `actions/cache` step, because that step
      # only saves when the job succeeds. This suite has a known timing-sensitive test, so a
      # save-on-green cache stays cold exactly through the runs that need it most: one flake
      # discards the download, the next run fetches again, and the rate limit this exists to
      # avoid is hit by the retry. The weights are valid whatever the tests concluded about
      # the code.
      - name: Restore embedding model cache
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: .knowl/models
          key: knowl-models-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('src/core/vector-profile.ts', 'src/core/config.ts') }}
          restore-keys: |
            knowl-models-${{ runner.os }}-node${{ matrix.node }}-
            knowl-models-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Check lockfile version
        run: npm run check:lockfile

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # `always()`, so a red suite still leaves the weights behind -- that is the whole point
      # of the split above. Guarded twice: `cache-hit` skips the upload when the exact key was
      # already restored, and `hashFiles` returns an empty string when nothing is on disk,
      # which is what stops a job that died before the tests ran from failing again here on a
      # missing path.
      - name: Save embedding model cache
        if: always() && steps.model-cache.outputs.cache-hit != 'true' && hashFiles('.knowl/models/**') != ''
        uses: actions/cache/save@v4
        with:
          path: .knowl/models
          key: ${{ steps.model-cache.outputs.cache-primary-key }}

  quality:
    name: lint, types, and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Needs the bundle: the docs check asks `knowl --help` what commands exist, and reads
      # the built CLI rather than the source so it sees what a user sees.
      - run: npm run build
      - name: Generated documentation is current
        run: npm run docs:check

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Production dependencies only: a dev-only advisory never reaches a user's install.
      #
      # Blocking at CRITICAL rather than HIGH, on evidence. The one high advisory today is
      # adm-zip's 4GB allocation on a crafted archive, reached through onnxruntime-node ->
      # @huggingface/transformers, and it has NO FIX AVAILABLE. A gate that cannot pass gets
      # switched off, and then nothing is gated -- so the blocking floor is set where it can
      # actually be met, and everything at high or above is reported beside it.
      - run: npm run audit:prod
      - name: High-severity advisories (reported, not blocking)
        run: npm run audit:report
        continue-on-error: true

  package:
    name: tarball smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # What `npm publish` would actually ship, installed the way a user installs it. Catches
      # a missing `files` entry or a dependency that only resolved from the repo checkout --
      # neither of which any test in the suite can see.
      - name: Pack and install the tarball
        run: |
          npm pack --silent
          mkdir -p /tmp/smoke && cd /tmp/smoke && npm init -y >/dev/null
          npm install --silent "$GITHUB_WORKSPACE"/dat999zx-knowl-*.tgz
          ./node_modules/.bin/knowl --version
          ./node_modules/.bin/knowl --help >/dev/null
