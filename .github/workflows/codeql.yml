name: CodeQL

# Static analysis on the default branch and on every pull request, plus a weekly run so a
# newly published query finds an old bug without waiting for someone to touch the file.
# Main and weekly, not every pull request. CodeQL takes minutes and the findings it produces
# are rarely branch-specific; catching them on main and on a schedule is the same coverage for
# a fraction of the runs.
on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: javascript-typescript
          # The query suite moved into the config file, because `paths-ignore` has nowhere else
          # to live -- `init` takes no such input. Both settings describe one decision (what is
          # analysed, and with what), so they belong in one place.
          config-file: ./.github/codeql/codeql-config.yml

      # No build step: this project is TypeScript compiled by tsup, and CodeQL analyses the
      # sources directly for javascript-typescript. Building first would analyse the bundle
      # and lose the file and line a finding belongs to.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
